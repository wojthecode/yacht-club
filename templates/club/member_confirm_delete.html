{% extends "base.html" %}

{% block content %}

  <h3>Are you sure you want to delete
    {% if user == member %}
      your profile
    {% else %}
      {{member.username}} profile
    {% endif %}
    ?</h3>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger px-5">
    <input onclick="history.back()" value="Cancel" class="btn btn-secondary px-0">
  </form>
{% endblock %}
