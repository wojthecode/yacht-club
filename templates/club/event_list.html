{% extends "base.html" %}

{% block content %}
  <h1 class="center">Upcoming Club Events</h1>
  <br>

  {% for event in event_list %}

    
    <h3>{{ event.name}}</h3>
    <h5>{{ event.date|date:"D, d N Y, H:i" }}</h5>
    <p>{{ event.description|linebreaksbr|truncatewords:30 }}</p>
    <a href="{{ event.get_absolute_url }}">Read more >></a>
    <hr>

  {% endfor %}

{% endblock %}
