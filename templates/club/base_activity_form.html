{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}

  <h1>{{ object|yesno:"Update,Create"}} {{ activity }}</h1>

  {% if user.role.management_rights %}

    <form action="" method="post" novalidate>
      {% csrf_token %}

      {{ form|crispy }}

      <button type="submit" value="submit" class="btn btn-primary rounded-pill px-2 py-0">
        {{ object|yesno:"Update,Create"}} 
      </button>

      <button type="button" onclick="history.back()" class="btn btn-primary rounded-pill px-2 py-0">
        Cancel
      </button>

    </form>

  {% else %}
    <br><br><hr>
    <h4 class="center">You don't have permission to add {{ activity }}</h4>
    <hr>
  {% endif %}

{% endblock %}
