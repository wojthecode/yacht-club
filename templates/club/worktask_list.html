{% extends "base.html" %}

{% block content %}
  <h1 class="center">Upcoming Work Tasks</h1>
  <br>

  {% for worktask in worktask_list %}

    
    <h3>{{ worktask.name}}</h3>
    <h5>{{ worktask.date }}</h5>
    <p>{{ worktask.description|linebreaksbr|truncatewords:30 }}</p>
    <a href="{{ worktask.get_absolute_url }}">Read more >></a>
    <hr>

  {% endfor %}

{% endblock %}
