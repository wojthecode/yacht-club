{% extends "base.html" %}

{% block content %}
  <h1>Delete boat: <strong class="darkred">{{ boat.name }}</strong>?</h1>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger px-5">
    <input onclick="history.back()" value="Cancel" class="btn btn-secondary px-0">
  </form>
{% endblock %}
