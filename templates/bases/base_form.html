{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static %}

{% block content %}

  <header class="header-2">
    <div class="page-header min-vh-45 relative"style="background-image: url('{% static 'img/bg/table.jpg' %}'); background-position: center 25%">
      <div class="container-fixed">
        <div class="container">
          <div class="row">
            <div class="col-lg-9 text-center mx-auto">
              <h1 class="text-white pt-0 mt-n6 border_text">
                {% block form_title %}{% endblock form_title%}
              </h1>
            </div>
          </div>
        </div>
      </div>
      {% include 'includes/waves.html' %}
    </div>
  </header>

  <section class="pt-3 pb-4 flex-fill">
    <div class="container">
      <div class="row">
        <div class="col-lg-12 z-index-2 border-radius-xl mt-n9 mx-auto py-3 blur shadow-blur">
          <div class="mx-auto col-lg-9">

            {% block form %}{% endblock form %}

          </div>
        </div>
      </div>
    </div>
  </section>

{% endblock content %}
