{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static %}

{% block content %}

  <header class="header-2">
    <div class="page-header min-vh-45 relative"style="background-image: url('{% static 'img/bg/table.jpg' %}'); background-position: center 25%">
      {% include 'includes/waves.html' %}
    </div>
  </header>

  <section class="pt-3 pb-4 flex-fill">
    <div class="container">
      <div class="row">
        <div class="col-lg-12 z-index-2 border-radius-xl mt-n10 mx-auto py-3 blur shadow-blur">
          <div class="mx-auto col-lg-9 px-3">

            <h4 class="py-2">Login</h4>

            {% if next %}
              <p>
                Please login or
                <a href="{% url 'club:member-create' %}" class="text-bold">
                  sign up
                </a>
                to see this page.
              </p>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
              {% csrf_token %}
              {{ form|crispy }}
              <input type="submit" value="Login" class="btn bg-gradient-primary rounded-pill px-5 py-2 mt-2" />
              <input type="hidden" name="next" value="{{ next }}" />
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
