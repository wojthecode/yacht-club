{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static %}

{% block content %}

  <header class="header-2">
    <div class="page-header min-vh-45 relative"style="background-image: url('{% static 'img/bg/lifebuoy.jpg' %}'); background-position: center 55%">
      {% include 'includes/waves.html' %}
    </div>
  </header>

  <section class="pt-3 pb-4 flex-fill">
    <div class="container">
      <div class="row">
        <div class="col-lg-12 z-index-2 border-radius-xl mt-n12 mx-auto py-3 blur shadow-blur">
          <div class="mx-auto col-lg-9 px-3">

            <h2 class="py-3">Change password:</h2>

            <form method="post" action="">
            {% csrf_token %}
            {{ form|crispy }}

            <input type="submit" value="Update password" class="btn bg-gradient-warning rounded-pill px-4 py-2" />
            <input type="hidden" name="next" value="{{ next }}" />
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>

{% endblock %}
