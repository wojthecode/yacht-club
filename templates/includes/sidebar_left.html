<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">User:
      <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a>
    </li>

    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary rounded-pill px-3 py-0 ">
          Logout
        </button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </li>
    
  {% else %}
    <li class="list-group-item"><a href="{% url 'login'%}">Login</a></li>
  {% endif %}

  <br>

  <li class="list-group-item"><a href="{% url 'club:index' %}">Home</a></li>
  <li class="list-group-item"><a href="{% url 'club:event-list' %}">Events</a></li>
  <li class="list-group-item"><a href="{% url 'club:worktask-list' %}">Work Tasks</a></li>
  <li class="list-group-item"><a href="#">opt 3</a></li>
</ul>
